<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b18" />
  <meta name="description" content="SYSTEM CATCH: atrapa cada elemento en su categoría. Minijuego arcade de Objeto, Sujeto y Concepto." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23070b18' stroke='%2338d6ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2338d6ff'/%3E%3C/svg%3E" />
  <title>SYSTEM CATCH · Atrapa la categoría</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- ================= PORTADA ================= -->
  <section id="screen-cover" class="screen is-active" aria-label="Portada de System Catch">
    <div class="cover">
      <p class="kicker">GIMNASIO 1 · TEORÍA DE SISTEMAS</p>
      <h1 class="logo">SYSTEM<span>CATCH</span></h1>
      <p class="tagline">Atrapa cada elemento en su categoría</p>

      <div class="cover-preview" aria-hidden="true">
        <span class="pv-chip objeto">Libro</span>
        <span class="pv-chip sujeto">Profesor</span>
        <span class="pv-chip concepto">Reglamento</span>
      </div>

      <div class="cover-zones" aria-hidden="true">
        <span class="zone-pill z-objeto"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 2.5l9 5v9l-9 5-9-5v-9l9-5zM12 2.5v9M3 7.5l9 4 9-4M12 11.5v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>OBJETO</span>
        <span class="zone-pill z-sujeto"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM3 21c0-3.3 4-6 9-6s9 2.7 9 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>SUJETO</span>
        <span class="zone-pill z-concepto"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M9 18a5 5 0 1 1 6 0 4 4 0 0 0-6 0zM10 21h4M11 17.5V20h2v-2.5M10 6V4M14 6V4M6 8H4M20 8h-2M7 5l-1.5-1.5M17 5l1.5-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>CONCEPTO</span>
      </div>

      <div class="cover-actions">
        <button id="btn-play" class="btn-play" data-sound="select">
          <span>JUGAR</span>
          <small>8 elementos · ~1 minuto</small>
        </button>
        <div class="cover-mini">
          <button id="btn-sound" class="icon-btn" aria-label="Activar o desactivar sonido"><span id="sound-icon"></span></button>
          <span class="best-line">RÉCORD: <strong id="best-cover">0</strong> pts</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= GAMEPLAY ================= -->
  <section id="screen-game" class="screen" aria-label="Juego">
    <header class="hud">
      <div class="hud-dots" id="hud-dots" aria-hidden="true"></div>
      <div class="hud-score">PTS <strong id="score" aria-live="polite">0</strong></div>
      <div class="hud-combo" id="combo-chip">COMBO x1</div>
    </header>

    <div class="arena" id="arena">
      <div class="danger-line" aria-hidden="true"><span></span></div>
      <div id="fall-zone" class="fall-zone" aria-live="polite">
        <p class="empty-hint" id="empty-hint">¡Prepárate!</p>
      </div>
    </div>

    <div class="catchers" role="group" aria-label="Categorías">
      <button class="catcher z-objeto" data-cat="objeto" aria-label="Categoría Objeto: elementos físicos">
        <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 2.5l9 5v9l-9 5-9-5v-9l9-5zM12 2.5v9M3 7.5l9 4 9-4M12 11.5v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>OBJETO</span>
      </button>
      <button class="catcher z-sujeto" data-cat="sujeto" aria-label="Categoría Sujeto: personas">
        <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM3 21c0-3.3 4-6 9-6s9 2.7 9 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>SUJETO</span>
      </button>
      <button class="catcher z-concepto" data-cat="concepto" aria-label="Categoría Concepto: ideas y reglas">
        <svg viewBox="0 0 24 24" width="28" height="28"><path d="M9 18a5 5 0 1 1 6 0 4 4 0 0 0-6 0zM10 21h4M11 17.5V20h2v-2.5M10 6V4M14 6V4M6 8H4M20 8h-2M7 5l-1.5-1.5M17 5l1.5-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>CONCEPTO</span>
      </button>
    </div>
  </section>

  <!-- ================= RESULTADO ================= -->
  <section id="screen-result" class="screen" aria-label="Resultado">
    <div class="result">
      <h2 class="result-title">¡COMPLETADO!</h2>
      <p class="result-sub" id="result-msg">Gran partida</p>

      <div class="result-grid">
        <div class="r-cell">
          <strong id="r-correct">0/8</strong>
          <span>atrapados</span>
        </div>
        <div class="r-cell">
          <strong id="r-combo">x1</strong>
          <span>combo máximo</span>
        </div>
        <div class="r-cell r-score">
          <strong id="r-score">0</strong>
          <span>puntos</span>
        </div>
      </div>

      <p class="best-line">RÉCORD: <strong id="r-best">0</strong> pts</p>

      <button id="btn-again" class="btn-play" data-sound="select">
        <span>JUGAR OTRA VEZ</span>
        <small>nueva partida</small>
      </button>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
