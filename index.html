<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05070f" />
  <meta name="description" content="System Lab: laboratorio interactivo para practicar los fundamentos de la Teoría General de Sistemas." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l11 6v10L16 29 5 19V9l11-6z' fill='%230a1020' stroke='%2338d6ff' stroke-width='2'/%3E%3Cpath d='M16 8l6 3.5v7L16 22l-6-3.5v-7L16 8z' fill='%2338d6ff'/%3E%3C/svg%3E" />
  <title>System Lab · Laboratorio de Sistemas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- Fondo dinámico -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-vignette" aria-hidden="true"></div>

  <!-- ===================== PANTALLA: INICIO ===================== -->
  <section id="screen-landing" class="screen is-active" aria-label="Pantalla de inicio">
    <div class="landing-wrap">
      <div class="landing-orbit" aria-hidden="true">
        <div class="orbit-ring r1"></div>
        <div class="orbit-ring r2"></div>
        <div class="orbit-ring r3"></div>
        <div class="core" aria-hidden="true">
          <div class="core-ring"></div>
          <div class="core-node" style="--d:0s"></div>
          <div class="core-node" style="--d:.6s"></div>
          <div class="core-node" style="--d:1.2s"></div>
          <div class="core-node" style="--d:1.8s"></div>
        </div>
      </div>

      <p class="landing-kicker">GIMNASIO 1 · OPTIMIZACIÓN I</p>
      <h1 class="landing-title"><span>S</span>YSTEM <span>L</span>AB</h1>
      <p class="landing-subtitle">Laboratorio de Sistemas</p>
      <p class="landing-tag">Analiza, construye y clasifica sistemas para dominar los fundamentos de la Teoría General de Sistemas.</p>

      <div class="landing-actions">
        <button id="btn-start" class="btn btn-primary btn-lg" data-sound="select">
          <span class="btn-glow"></span>
          <span class="btn-label">Iniciar laboratorio</span>
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-continue" class="btn btn-ghost btn-lg hidden" data-sound="select">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <span class="btn-label">Continuar</span>
        </button>
      </div>

      <div class="landing-secondary">
        <button id="btn-instructions" class="link-chip" data-sound="select">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Instrucciones
        </button>
        <button id="btn-tutorial-landing" class="link-chip" data-sound="select">
          <svg viewBox="0 0 24 24"><path d="M12 6a3.5 3.5 0 0 0-3.5 3.5v5A3.5 3.5 0 0 0 12 18a3.5 3.5 0 0 0 3.5-3.5v-5A3.5 3.5 0 0 0 12 6z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Ver tutorial
        </button>
        <button id="btn-sound-landing" class="icon-btn" data-sound="select" aria-label="Activar o desactivar sonido">
          <span id="sound-icon-landing"></span>
        </button>
        <button id="btn-reset-landing" class="link-chip link-danger" data-sound="select">
          <svg viewBox="0 0 24 24"><path d="M4 4v6h6M20 20v-6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 9A7 7 0 0 1 18 8M18.5 15A7 7 0 0 1 6 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Reiniciar progreso
        </button>
      </div>
    </div>
  </section>

  <!-- ===================== BARRA SUPERIOR (en app) ===================== -->
  <header id="topbar" class="topbar hidden" aria-label="Barra de navegación">
    <button id="btn-home" class="topbar-brand" data-sound="select" aria-label="Volver al mapa de módulos">
      <svg class="brand-mark" viewBox="0 0 32 32"><path d="M16 3l11 6v10L16 29 5 19V9l11-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16 3v10l11-7M16 13v16M16 13L5 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" opacity=".7"/></svg>
      <span class="brand-text">SYSTEM<span class="brand-accent">LAB</span></span>
    </button>
    <div class="topbar-title" id="topbar-title">Laboratorio</div>
    <div class="topbar-right">
      <div class="stat-pill" title="Racha de aciertos" id="stat-streak">
        <svg viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5L13 2z" fill="currentColor"/></svg>
        <span id="streak-value">0</span>
      </div>
      <div class="stat-pill stat-score" title="Puntuación" id="stat-score">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 8.5a3 3 0 0 1 3-3 3 3 0 0 1 3 3c0 1.5-1 2.3-1.8 3.1-.8.8-1.7 1.7-1.7 3.4h3.5M12 19h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span id="score-value">0</span>
      </div>
      <button id="btn-sound-top" class="icon-btn" data-sound="select" aria-label="Activar o desactivar sonido">
        <span id="sound-icon-top"></span>
      </button>
      <button id="btn-tutorial-top" class="icon-btn" data-sound="select" aria-label="Ver tutorial">
        <svg viewBox="0 0 24 24"><path d="M12 6a3.5 3.5 0 0 0-3.5 3.5v5A3.5 3.5 0 0 0 12 18a3.5 3.5 0 0 0 3.5-3.5v-5A3.5 3.5 0 0 0 12 6z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- ===================== PANTALLA: HUB / MAPA ===================== -->
  <section id="screen-hub" class="screen" aria-label="Mapa de módulos"></section>

  <!-- ===================== PANTALLA: MÓDULO 1 ===================== -->
  <section id="screen-module1" class="screen" aria-label="Módulo 1: Anatomía del sistema"></section>

  <!-- ===================== PANTALLA: MÓDULO 2 ===================== -->
  <section id="screen-module2" class="screen" aria-label="Módulo 2: Elementos del sistema"></section>

  <!-- ===================== PANTALLA: MÓDULO 3 ===================== -->
  <section id="screen-module3" class="screen" aria-label="Módulo 3: Clasificación de sistemas"></section>

  <!-- ===================== PANTALLA: DESAFÍO ===================== -->
  <section id="screen-challenge" class="screen" aria-label="Desafío integrador"></section>

  <!-- ===================== PANTALLA: RESULTADOS ===================== -->
  <section id="screen-results" class="screen" aria-label="Resultados finales"></section>

  <!-- ===================== MODALES ===================== -->
  <div id="modal-root" class="modal-root is-hidden" aria-live="polite"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <div id="achievement-root" class="achievement-root" aria-live="polite"></div>
  <div id="fx-root" class="fx-root" aria-hidden="true"></div>

  <noscript>
    <div class="noscript">System Lab requiere JavaScript. Actívalo para continuar.</div>
  </noscript>

  <!-- Datos -->
  <script src="data/systems.js"></script>
  <script src="data/module1.js"></script>
  <script src="data/module2.js"></script>
  <script src="data/module3.js"></script>
  <script src="data/challenge.js"></script>
  <!-- Utilidades -->
  <script src="js/audio.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/dragdrop.js"></script>
  <!-- App -->
  <script src="js/app.js"></script>
</body>
</html>
